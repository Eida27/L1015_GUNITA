name: gunita

services:
  db:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_USER: gunita
      POSTGRES_DB: gunita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup first}
    ports:
      - '127.0.0.1:${DB_PORT:-55435}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [database, host-access]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gunita -d gunita']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
  mailpit:
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - '127.0.0.1:${SMTP_PORT:-1028}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8028}:8025'
    networks: [local]
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 128m
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    profiles: [proxy]
    ports:
      - '127.0.0.1:${CADDY_PORT:-8088}:80'
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      WEB_PORT: ${PORT:-3000}
    networks: [local]
    mem_limit: 128m

networks:
  database:
    internal: true
  host-access:
    driver: bridge
  local:

volumes:
  pgdata:
